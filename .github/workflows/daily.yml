name: Send daily meditation

# Sem `schedule:` de propósito. O cron do GitHub Actions é best-effort e estava
# atrasando horas; quem dispara é um job externo (cron-job.org) chamando a API de
# workflow_dispatch às 06:00 America/Sao_Paulo. Veja o README.
on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
